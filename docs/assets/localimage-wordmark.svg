  .spark.b { animation-delay: 1.2s; } .spark.c { animation-delay: 2.4s; }
  @keyframes breathe { 0%,100% {opacity:.28} 50% {opacity:.5} }
  @keyframes sweep { 0%,30% {transform:translate(-700px,-260px)} 75%,100% {transform:translate(1100px,260px)} }
  @keyframes twinkle { 0%,100% {opacity:.15; transform:scale(.6)} 50% {opacity:.95; transform:scale(1)} }
  @media (prefers-reduced-motion: reduce) { .glow, .shine, .spark { animation: none; } .shine { display: none; } }
</style>
